<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24352e">
  <meta name="description" content="Сергей — юбилейный спецвыпуск семейного журнала. Интерактивный подарок к 71-летию.">
  <title>СЕРГЕЙ · Юбилейный спецвыпуск</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="archive.css">
  <script defer src="story-data.js"></script>
  <script defer src="archive-ui.js"></script>
  <script defer src="sound-data.js"></script>
  <script defer src="sound-manager.js"></script>
  <script defer src="sound-controls.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="#main" aria-label="Перейти к журналу">СЕРГЕЙ<span>семейное издание · с 1955 года</span></a>
    <div class="tools"><button id="sound" class="tool" aria-pressed="false">Включить звук</button><button id="sound-settings" class="tool" aria-expanded="false" aria-controls="sound-panel">Настройки звука</button><button id="menu" class="tool" aria-expanded="false" aria-controls="menu-panel">Меню</button></div>
  </header>
  <section id="sound-panel" class="sound-panel" aria-label="Настройки звука" hidden>
    <div class="sound-layer"><label><input type="checkbox" data-sound-setting="music"> Музыка</label><label>Громкость музыки <input type="range" min="0" max="1" step="0.01" data-sound-setting="musicVolume"></label></div>
    <div class="sound-layer"><label><input type="checkbox" data-sound-setting="effects"> Атмосфера и звуки предметов</label><label>Громкость атмосферы и предметов <input type="range" min="0" max="1" step="0.01" data-sound-setting="effectsVolume"></label></div>
    <div class="sound-layer"><label><input type="checkbox" data-sound-setting="recordings"> Семейные записи</label><label>Громкость семейных записей <input type="range" min="0" max="1" step="0.01" data-sound-setting="recordingVolume"></label></div>
    <p id="sound-status" role="status"></p>
  </section>
  <div id="menu-panel" class="menu-panel" hidden><button id="restart" class="tool">Начать сначала</button><span>Архив сохраняется на этом устройстве.</span></div>
  <main id="main" tabindex="-1">
    <div class="edition"><span>ЮБИЛЕЙНЫЙ СПЕЦВЫПУСК</span><span>№ 71 / один экземпляр для главного героя</span></div>
    <div class="progress-row"><span id="chapter-label"></span><span id="page-label"></span></div>
    <div class="progress-track" role="progressbar" aria-label="Прочитано страниц" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div>
    <section id="scene" aria-labelledby="scene-title"></section>
    <footer class="page-footer"><span>Независимое семейное издание, основано в детстве</span><span>Архив открыт. История продолжается.</span></footer>
  </main>
  <noscript><p class="noscript">Для открытия семейного архива включите JavaScript в браузере.</p></noscript>
</body>
</html>
